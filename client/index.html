<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indian Poker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Landing -->
        <section id="landing" class="screen">
            <header class="landing-header">
                <span class="brand">Indian Poker</span>
            </header>

            <div class="landing-body">
                <p class="landing-subtitle">방을 만들거나 코드를 입력해 참가하세요</p>

                <div class="form-group">
                    <form id="form-create">
                        <h2>방 만들기</h2>
                        <input name="nickname" placeholder="닉네임" required maxlength="16" autocomplete="off">
                        <select name="max_players">
                            <option value="2">2명</option>
                            <option value="3">3명</option>
                            <option value="4" selected>4명</option>
                        </select>
                        <button type="submit">만들기</button>
                    </form>

                    <form id="form-join">
                        <h2>참가하기</h2>
                        <input name="room_code" placeholder="방 코드 (6자리)" required maxlength="6" pattern="[A-Z2-9]{6}" autocapitalize="characters" autocomplete="off">
                        <input name="nickname" placeholder="닉네임" required maxlength="16" autocomplete="off">
                        <button type="submit">참가</button>
                    </form>
                </div>
            </div>

            <footer class="site-footer">
                <div class="footer-inner">
                    <div class="footer-left">
                        <span class="footer-logo">crns<sup>&reg;</sup></span>
                        <p class="footer-copy">&copy; 2026 Cheolwon Park. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        </section>

        <!-- Lobby -->
        <section id="lobby" class="screen hidden">
            <header class="screen-header">
                <span class="brand-sm">Indian Poker</span>
                <span class="room-badge" id="lobby-badge"></span>
            </header>

            <div class="lobby-body">
                <h2 class="lobby-title">대기실</h2>
                <ul id="lobby-players"></ul>
                <button id="btn-start" class="btn-primary" hidden>게임 시작</button>
            </div>
        </section>

        <!-- Game -->
        <section id="game" class="screen hidden">
            <header class="screen-header">
                <span class="brand-sm">Indian Poker</span>
                <div class="game-meta">
                    <span class="meta-item">핸드 <strong id="game-hand">1</strong></span>
                    <span class="meta-divider"></span>
                    <span class="meta-item">팟 <strong id="game-pot">0</strong></span>
                </div>
            </header>

            <div class="game-body">
                <div id="game-players"></div>

                <div id="game-actions" class="hidden">
                    <button data-action="check" class="btn-action">체크</button>
                    <button data-action="fold" class="btn-action btn-fold">폴드</button>
                    <div class="raise-group">
                        <input id="raise-amount" type="number" min="0" step="5" placeholder="레이즈 금액">
                        <button data-action="raise" class="btn-action btn-raise">레이즈</button>
                    </div>
                </div>

                <div id="game-message"></div>
            </div>
        </section>
    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
